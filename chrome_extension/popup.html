<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Text Detector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      padding: 14px;
      font-size: 13px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
      color: #fff;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.3px;
    }
    .status-pill {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      background: #1e293b;
      color: #94a3b8;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.online {
      background: #10b981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
    }
    .presets-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .preset-btn {
      flex: 1;
      padding: 4px 6px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      border-radius: 6px;
      font-size: 10.5px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
      white-space: nowrap;
    }
    .preset-btn:hover {
      background: #334155;
      color: #f8fafc;
      border-color: #6366f1;
    }
    .textarea-wrapper {
      position: relative;
      margin-bottom: 10px;
    }
    textarea {
      width: 100%;
      height: 85px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.4;
      resize: vertical;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus {
      border-color: #6366f1;
    }
    .char-count {
      position: absolute;
      right: 8px;
      bottom: 6px;
      font-size: 10px;
      color: #64748b;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn-grab {
      padding: 8px 10px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .btn-grab:hover {
      background: #334155;
      color: #f8fafc;
    }
    .btn-analyze {
      flex: 1;
      padding: 8px 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      color: #fff;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      transition: all 0.2s;
    }
    .btn-analyze:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-analyze:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results Card */
    #result-box {
      display: none;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .verdict-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .verdict-badge {
      font-size: 12.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: -0.2px;
    }
    .badge-ai { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .badge-human { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-paraphrased { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    
    .conf-value {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .progress-bar-bg {
      height: 6px;
      background: #0f172a;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .models-row {
      display: flex;
      justify-content: space-between;
      background: #0f172a;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 11px;
    }
    .model-tag { color: #94a3b8; }
    .model-score { font-weight: 600; color: #f1f5f9; }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .metric-chip {
      background: #0f172a;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 10.5px;
    }
    .metric-label { color: #64748b; font-size: 9.5px; margin-bottom: 2px; }
    .metric-num { font-weight: 600; color: #cbd5e1; }

    .footer {
      font-size: 10px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
    }
    .error-box {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="logo-badge">⚡</div>
      <div class="title">AI Text Detector</div>
    </div>
    <div class="status-pill" id="status-pill">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Checking API...</span>
    </div>
  </div>

  <div class="presets-row">
    <button class="preset-btn" id="preset-ai">🤖 ChatGPT</button>
    <button class="preset-btn" id="preset-human">👤 Human</button>
    <button class="preset-btn" id="preset-paraphrase">🔄 Paraphrased</button>
  </div>

  <div class="textarea-wrapper">
    <textarea id="text-input" placeholder="Type text or select text on webpage..."></textarea>
    <div class="char-count" id="char-count">0 chars</div>
  </div>

  <div class="actions">
    <button class="btn-grab" id="btn-grab" title="Extract highlighted text from active browser tab">
      <span>📄</span> Grab Selected
    </button>
    <button class="btn-analyze" id="btn-analyze">
      <div class="spinner" id="spinner"></div>
      <span id="btn-label">Analyze Text</span>
    </button>
  </div>

  <div class="error-box" id="error-box"></div>

  <div id="result-box">
    <div class="verdict-banner">
      <div class="verdict-badge" id="verdict-badge">AI-GENERATED</div>
      <div class="conf-value" id="conf-value">92.4% Conf</div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill" style="width: 0%;"></div>
    </div>

    <div class="models-row">
      <div><span class="model-tag">DeBERTa v3:</span> <span class="model-score" id="score-deberta">--</span></div>
      <div><span class="model-tag">Random Forest:</span> <span class="model-score" id="score-rf">--</span></div>
    </div>

    <div class="metrics-grid">
      <div class="metric-chip">
        <div class="metric-label">PERPLEXITY (PPL)</div>
        <div class="metric-num" id="val-ppl">--</div>
      </div>
      <div class="metric-chip">
        <div class="metric-label">BURSTINESS (&sigma;/&mu;)</div>
        <div class="metric-num" id="val-burst">--</div>
      </div>
      <div class="metric-chip">
        <div class="metric-label">TTR (DIVERSITY)</div>
        <div class="metric-num" id="val-ttr">--</div>
      </div>
      <div class="metric-chip">
        <div class="metric-label">SENTIMENT & ENTROPY</div>
        <div class="metric-num" id="val-sent">--</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <span>Dual-Branch DeBERTa & RF Ensemble</span>
    <span id="latency-tag">⚡ Ready</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
