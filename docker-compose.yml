services:
  # COMPUTER NETWORKS: Nginx reverse proxy (Layer 7 load balancer)
  # Sits in front of the FastAPI app, handles HTTP routing, WebSocket upgrade,
  # rate limiting, and proxying. Demonstrates CN concepts: reverse proxy,
  # load balancing, HTTP headers, TCP connection management.
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"       # HTTP (port 80 = IANA standard for HTTP)
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=postgresql://mlflow:mlflow@postgres:5432/mlflow
    depends_on:
      - redis
      - postgres
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=postgresql://mlflow:mlflow@postgres:5432/mlflow
    depends_on:
      - redis
      - postgres
    command: celery -A tasks worker --loglevel=info

  # COMPUTER NETWORKS: Redis — in-memory data store used as message broker
  # Celery workers communicate with the web server via Redis pub/sub channels.
  # Demonstrates CN concept: message queuing over TCP (port 6379).
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow
      - POSTGRES_DB=mlflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MLOPS: MLflow tracking server for experiment logging and model registry
  mlflow:
    image: python:3.10-slim
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=postgresql://mlflow:mlflow@postgres:5432/mlflow
    depends_on:
      - postgres
    command: >
      bash -c "pip install mlflow psycopg2-binary &&
      mlflow server --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow --default-artifact-root ./mlruns --host 0.0.0.0 --port 5000"
    volumes:
      - mlflow_data:/app/mlruns

  # MLOPS: Prometheus scrapes /metrics from FastAPI for monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  # MLOPS: Grafana dashboards for visualizing Prometheus metrics
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mlflow_data:

