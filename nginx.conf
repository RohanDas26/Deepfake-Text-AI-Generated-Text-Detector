# =============================================================================
# COMPUTER NETWORKS: Nginx Reverse Proxy Configuration
# =============================================================================
#
# Nginx acts as a Layer 7 (Application Layer) reverse proxy in our system.
# It sits between clients and the FastAPI backend, handling:
#
#   1. LOAD BALANCING: Distributes requests across multiple backend replicas
#      using Round-Robin algorithm (default) -- CN concept: traffic distribution
#
#   2. REVERSE PROXY: Hides backend server details from clients
#      (security through obscurity) -- CN concept: network topology hiding
#
#   3. HTTP/1.1 Keep-Alive: Persistent TCP connections reduce handshake overhead
#      -- CN concept: connection management, TCP three-way handshake
#
#   4. PROXY HEADERS: Passes client IP via X-Real-IP / X-Forwarded-For headers
#      -- CN concept: HTTP header fields, proxy chaining
#
#   5. WEBSOCKET UPGRADE: Handles HTTP -> WS protocol upgrade (RFC 6455)
#      -- CN concept: application-layer protocol switching
#
#   6. RATE LIMITING: nginx-level connection rate limiting (complements SlowAPI)
#      -- CN concept: traffic shaping and QoS
#
# OSI Model Layer Breakdown of this config:
#   Layer 7 (Application) : HTTP/HTTPS, WebSocket protocol handling
#   Layer 4 (Transport)   : TCP connection management, keep-alive
#   Layer 3 (Network)     : IP address forwarding via X-Real-IP header
# =============================================================================

# CN: Rate limiting zone -- track requests by client IP
# Allocates 10MB memory for IP tracking (stores ~160,000 IPs)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

events {
    worker_connections 1024;  # Max simultaneous TCP connections per worker
}

http {
    # CN: Upstream block = Load Balancer Pool
    # Round-Robin distributes incoming TCP connections across backend replicas
    upstream ai_text_detection_backend {
        # Primary backend (Docker internal DNS resolves 'web' -> container IP)
        server web:8000;
        # Uncomment to add more replicas for horizontal scaling:
        # server web_replica1:8000;
        # server web_replica2:8000;

        # CN: Keepalive -- maintains persistent TCP connections to backend
        # Avoids repeated TCP 3-way handshake (SYN -> SYN-ACK -> ACK)
        keepalive 32;
    }

    server {
        # CN: Listen on port 80 (HTTP standard port, IANA assigned)
        listen 80;
        server_name localhost;

        # CN: Apply rate limit -- 30 requests/minute per IP, burst=10
        # 'burst' allows short spikes above the rate (token bucket algorithm)
        limit_req zone=api_limit burst=10 nodelay;

        # CN: Main proxy location -- forward all traffic to FastAPI backend
        location / {
            proxy_pass http://ai_text_detection_backend;

            # CN: HTTP/1.1 required for keep-alive and chunked transfer encoding
            proxy_http_version 1.1;

            # CN: Forward original client IP to backend (important for rate limiting)
            # X-Real-IP and X-Forwarded-For are de-facto standard HTTP header extensions
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CN: WebSocket protocol upgrade handling
            # HTTP Upgrade mechanism (RFC 7230): switches from HTTP/1.1 to WebSocket
            # This enables the /ws/predict endpoint to work through the proxy
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # CN: Timeout settings for long-running inference requests
            proxy_read_timeout    300s;  # Max wait for Celery task response
            proxy_connect_timeout 10s;   # TCP connection timeout
            proxy_send_timeout    60s;   # Sending request timeout
        }

        # CN: Health check endpoint (used by load balancer to probe backend liveness)
        location /health {
            proxy_pass http://ai_text_detection_backend/docs;
            access_log off;
        }

        # CN: Prometheus metrics endpoint (internal monitoring traffic)
        location /metrics {
            proxy_pass http://ai_text_detection_backend/metrics;
            # Restrict to internal network only (CN: network access control)
            allow 172.0.0.0/8;   # Docker internal subnet
            allow 127.0.0.1;
            deny  all;
        }
    }
}
